
mysql:
  image: mysql:8.0
  database: "madhubani_db"
  user: "madhubani_user"
  port: 3306
  existingSecret: "madhubani-db-secret" # The k8s secret you just created
backend:
  image: santosh051/madhubani-backend:ccc83be154a79c14df2baf2257ba439706aed8a7
  port: 3000
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
frontend:
  image: santosh051/madhubani-frontend:ccc83be154a79c14df2baf2257ba439706aed8a7
  port: 80
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  
