mysql:
  image: mysql:8.0
  database: "madhubani_db"
  user: "madhubani_user"
  port: 3306
  existingSecret: "madhubani-db-secret"

backend:
  image: santosh051/madhubani-backend:ccc83be154a79c14df2baf2257ba439706aed8a7
  replicas: 2
  port: 3000

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

frontend:
  image: santosh051/madhubani-frontend:ccc83be154a79c14df2baf2257ba439706aed8a7
  replicas: 2
  port: 80

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70