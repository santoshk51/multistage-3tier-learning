# ==========================================================
# SONARQUBE PROJECT IDENTIFICATION
# ==========================================================

# Must match the existing SonarQube project.
sonar.projectKey=madhubani-3tier-app


# ==========================================================
# SOURCE DIRECTORIES
# ==========================================================

# Analyze backend and frontend source code.
sonar.sources=backend,frontend


# ==========================================================
# JAVASCRIPT / TYPESCRIPT COVERAGE
# ==========================================================

# Jest generates this LCOV coverage report.
#
# The GitHub Actions SonarQube job downloads this file
# before starting the SonarQube scanner.
#
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info


# ==========================================================
# EXCLUSIONS
# ==========================================================

# Do not analyze installed dependencies.
sonar.exclusions=backend/node_modules/**,frontend/node_modules/**

# Do not analyze generated coverage files as source code.
sonar.coverage.exclusions=backend/coverage/**