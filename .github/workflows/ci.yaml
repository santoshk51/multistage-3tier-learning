name: Madhubani Three-Tier CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # 1. FRONTEND VALIDATION
  # ==========================================================
  frontend-ci:
    name: Frontend chal raha hai
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify frontend files
        run: |
          set -e

          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/app.js
          test -f frontend/nginx.conf
          test -f frontend/Dockerfile

          echo "All required frontend files are present."

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js


  # ==========================================================
  # 2. BACKEND VALIDATION
  # ==========================================================
  backend-ci:
    name: Backend chal raha hai
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          npm ci

      - name: Check backend JavaScript syntax
        run: |
          node --check server.js


  # ==========================================================
  # 3. SONARQUBE ANALYSIS
  # ==========================================================
  sonarqube:
    name: SonarQube Analysis

    # Runs on the Ubuntu VM self-hosted runner
    runs-on: self-hosted

    needs:
      - frontend-ci
      - backend-ci

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Check SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ==========================================================
  # 4. DOCKER BUILD, TRIVY SCAN AND PUSH
  # ==========================================================
  docker-build-scan-and-push:
    name: Build, Scan and Push Docker Images

    runs-on: ubuntu-latest

    needs:
      - sonarqube

    # Only build and push Docker images on pushes to main.
    # Pull requests will run frontend/backend/SonarQube validation
    # but will not push images to Docker Hub.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. SET UP DOCKER BUILDX
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # 3. LOGIN TO DOCKER HUB
      # ------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------------------
      # 4. BUILD FRONTEND IMAGE
      # ------------------------------------------------------
      - name: Build frontend image locally
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          # Do not push before Trivy scanning.
          push: false

          # Load image into local Docker image store.
          load: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ------------------------------------------------------
      # 5. BUILD BACKEND IMAGE
      # ------------------------------------------------------
      - name: Build backend image locally
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile

          # Do not push before Trivy scanning.
          push: false

          # Load image into local Docker image store.
          load: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ------------------------------------------------------
      # 6. VERIFY LOCALLY BUILT IMAGES
      # ------------------------------------------------------
      - name: Verify locally built images
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Docker images available on the runner"
          echo "========================================"

          docker image ls

          echo ""
          echo "Checking frontend image..."

          docker image inspect \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}" \
            > /dev/null

          echo "Frontend image found successfully."

          echo ""
          echo "Checking backend image..."

          docker image inspect \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}" \
            > /dev/null

          echo "Backend image found successfully."


      # ------------------------------------------------------
      # 7. TRIVY FRONTEND IMAGE SCAN
      # ------------------------------------------------------
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table

          # Learning mode:
          # vulnerabilities are displayed but do not stop pipeline.
          exit-code: "0"


      # ------------------------------------------------------
      # 8. TRIVY BACKEND IMAGE SCAN
      # ------------------------------------------------------
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"


      # ------------------------------------------------------
      # 9. PUSH FRONTEND IMAGE
      # ------------------------------------------------------
      - name: Push frontend image to Docker Hub
        shell: bash
        run: |
          set -e

          echo "Pushing commit-specific frontend image..."

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}"

          echo "Pushing latest frontend image..."

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:latest"


      # ------------------------------------------------------
      # 10. PUSH BACKEND IMAGE
      # ------------------------------------------------------
      - name: Push backend image to Docker Hub
        shell: bash
        run: |
          set -e

          echo "Pushing commit-specific backend image..."

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}"

          echo "Pushing latest backend image..."

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:latest"


      # ------------------------------------------------------
      # 11. PIPELINE SUMMARY
      # ------------------------------------------------------
      - name: Print Docker pipeline summary
        shell: bash
        run: |
          echo "========================================"
          echo "Docker pipeline completed successfully"
          echo "========================================"

          echo ""
          echo "Frontend image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}"

          echo ""
          echo "Backend image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}"

          echo ""
          echo "Trivy security gate: Learning mode"
          echo "Trivy exit code: 0"


  # ==========================================================
  # 5. DEPLOY TO UBUNTU VM
  # ==========================================================
  #
  # IMPORTANT:
  #
  # This job runs directly inside your Ubuntu VM because
  # the VM has the GitHub Actions self-hosted runner.
  #
  # There is NO SSH.
  # There is NO SCP.
  # There is NO EC2_HOST.
  # There is NO EC2_SSH_KEY.
  #
  # The runner user is "santosh", as shown by your
  # GitHub Actions runner path:
  #
  # /home/santosh/actions-runner/
  #
  # Therefore $HOME is used instead of hard-coding
  # /home/santoshbhai.
  #
  # ==========================================================
  deploy-to-ubuntu-vm:
    name: Deploy Application to Ubuntu VM

    needs:
      - docker-build-scan-and-push

    runs-on: self-hosted

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. SHOW RUNNER INFORMATION
      # ------------------------------------------------------
      - name: Verify deployment environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Deployment environment"
          echo "========================================"

          echo "Current user:"
          whoami

          echo ""
          echo "Home directory:"
          echo "$HOME"

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "Operating system:"
          uname -a

          echo ""
          echo "Docker version:"
          docker --version

          echo ""
          echo "Docker Compose version:"
          docker compose version

          echo ""
          echo "========================================"


      # ------------------------------------------------------
      # 3. VERIFY DOCKER ACCESS
      # ------------------------------------------------------
      - name: Verify Docker access
        shell: bash
        run: |
          set -e

          echo "Checking Docker daemon..."

          docker ps

          echo ""
          echo "Docker access confirmed."


      # ------------------------------------------------------
      # 4. PREPARE APPLICATION DIRECTORY
      # ------------------------------------------------------
      #
      # IMPORTANT:
      #
      # Do NOT use sudo here.
      #
      # GitHub Actions runs non-interactively, so sudo would
      # ask for a password and fail with:
      #
      # sudo: a terminal is required to authenticate
      #
      # $HOME automatically points to the actual runner user.
      #
      # In your current runner it is:
      #
      # /home/santosh
      #
      # ------------------------------------------------------
      - name: Prepare application directory
        shell: bash
        run: |
          set -e

          echo "Creating application directory..."

          mkdir -p "$HOME/madhubani-app"

          echo "Copying compose.yaml..."

          cp compose.yaml \
            "$HOME/madhubani-app/compose.yaml"

          echo ""
          echo "Application directory:"
          ls -la "$HOME/madhubani-app"


      # ------------------------------------------------------
      # 5. VALIDATE DOCKER COMPOSE CONFIGURATION
      # ------------------------------------------------------
      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -e

          cd "$HOME/madhubani-app"

          echo "========================================"
          echo "Docker Compose configuration"
          echo "========================================"

          docker compose config

          echo ""
          echo "Docker Compose configuration is valid."


      # ------------------------------------------------------
      # 6. LOGIN TO DOCKER HUB ON VM
      # ------------------------------------------------------
      #
      # The VM needs to pull private Docker Hub images if
      # the repositories are private.
      #
      # Using --password-stdin prevents the token from
      # appearing directly in the command arguments.
      #
      # If your Docker Hub repositories are PUBLIC, this
      # login is not strictly required for pulling images.
      #
      # ------------------------------------------------------
      - name: Login to Docker Hub on Ubuntu VM
        shell: bash
        run: |
          set -e

          echo "Logging in to Docker Hub..."

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

          echo "Docker Hub login successful."


      # ------------------------------------------------------
      # 7. PULL LATEST DOCKER IMAGES
      # ------------------------------------------------------
      - name: Pull latest Docker images
        shell: bash
        run: |
          set -e

          cd "$HOME/madhubani-app"

          echo "========================================"
          echo "Pulling latest Docker images"
          echo "========================================"

          docker compose pull

          echo ""
          echo "Docker images pulled successfully."


      # ------------------------------------------------------
      # 8. DEPLOY APPLICATION
      # ------------------------------------------------------
      - name: Deploy latest images
        shell: bash
        run: |
          set -e

          cd "$HOME/madhubani-app"

          echo "======================================"
          echo "Starting Madhubani deployment"
          echo "======================================"

          echo ""
          echo "Starting updated application..."

          docker compose up -d --remove-orphans

          echo ""
          echo "Application containers started."


      # ------------------------------------------------------
      # 9. SHOW CONTAINER STATUS
      # ------------------------------------------------------
      - name: Check container status
        shell: bash
        run: |
          set -e

          cd "$HOME/madhubani-app"

          echo "========================================"
          echo "Current container status"
          echo "========================================"

          docker compose ps

          echo ""
          echo "All Docker containers:"
          docker ps


      # ------------------------------------------------------
      # 10. CLEAN UNUSED IMAGES
      # ------------------------------------------------------
      - name: Remove unused Docker images
        shell: bash
        run: |
          set -e

          echo "Removing unused Docker images..."

          docker image prune -f

          echo "Docker cleanup completed."


      # ------------------------------------------------------
      # 11. DEPLOYMENT SUMMARY
      # ------------------------------------------------------
      - name: Deployment summary
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "Madhubani deployment completed"
          echo "========================================"

          echo ""
          echo "Runner:"
          echo "santosh-vm"

          echo ""
          echo "Deployment directory:"
          echo "$HOME/madhubani-app"

          echo ""
          echo "Frontend image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:latest"

          echo ""
          echo "Backend image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:latest"

          echo ""
          echo "Application status:"
          docker compose -f "$HOME/madhubani-app/compose.yaml" ps

          echo ""
          echo "========================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "========================================"






          
    
