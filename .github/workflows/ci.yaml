name: Madhubani Three-Tier CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ==========================================================
# GITHUB ACTIONS PERMISSIONS
# ==========================================================
permissions:
  contents: write
  actions: read


jobs:

  # ==========================================================
  # 1. FRONTEND VALIDATION
  # ==========================================================
  frontend-ci:
    name: Frontend chal raha hai
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT SOURCE CODE
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # VERIFY REQUIRED FRONTEND FILES
      # ------------------------------------------------------
      - name: Verify frontend files
        run: |
          set -e

          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/app.js
          test -f frontend/nginx.conf
          test -f frontend/Dockerfile

          echo "All required frontend files are present."


      # ------------------------------------------------------
      # CHECK FRONTEND JAVASCRIPT SYNTAX
      # ------------------------------------------------------
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js



  # ==========================================================
  # 2. BACKEND VALIDATION + TEST + COVERAGE
  # ==========================================================
  backend-ci:
    name: Backend chal raha hai
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      # ------------------------------------------------------
      # CHECKOUT SOURCE CODE
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # SET UP NODE.JS
      # ------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json


      # ------------------------------------------------------
      # INSTALL BACKEND DEPENDENCIES
      # ------------------------------------------------------
      - name: Install backend dependencies
        run: |
          npm ci


      # ------------------------------------------------------
      # CHECK BACKEND JAVASCRIPT SYNTAX
      # ------------------------------------------------------
      - name: Check backend JavaScript syntax
        run: |
          node --check server.js


      # ------------------------------------------------------
      # RUN JEST TESTS WITH COVERAGE
      # ------------------------------------------------------
      #
      # This command:
      #
      # 1. Runs all backend tests
      # 2. Generates coverage information
      # 3. Creates:
      #
      #    backend/coverage/lcov.info
      #
      # SonarQube will later read this file.
      #
      # ------------------------------------------------------
      - name: Run backend tests with coverage
        run: |
          npm run test:coverage


      # ------------------------------------------------------
      # VERIFY COVERAGE REPORT
      # ------------------------------------------------------
      #
      # We explicitly check that lcov.info exists.
      #
      # If this file does not exist, the CI job fails here
      # instead of allowing SonarQube to run without coverage.
      #
      # ------------------------------------------------------
      - name: Verify coverage report
        run: |
          set -e

          test -f coverage/lcov.info

          echo "========================================"
          echo "Coverage report found"
          echo "========================================"

          ls -lh coverage/lcov.info


      # ------------------------------------------------------
      # UPLOAD COVERAGE AS GITHUB ACTIONS ARTIFACT
      # ------------------------------------------------------
      #
      # backend-ci and sonarqube are separate jobs.
      #
      # Files created in backend-ci are NOT automatically
      # available inside the SonarQube job.
      #
      # Therefore we upload lcov.info as an artifact.
      #
      # ------------------------------------------------------
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: error



  # ==========================================================
  # 3. SONARQUBE ANALYSIS
  # ==========================================================
  sonarqube:
    name: SonarQube Analysis

    # --------------------------------------------------------
    # Use your Ubuntu VM self-hosted runner.
    # --------------------------------------------------------
    runs-on: self-hosted

    # --------------------------------------------------------
    # SonarQube starts only after frontend and backend
    # validation has completed successfully.
    # --------------------------------------------------------
    needs:
      - frontend-ci
      - backend-ci

    steps:

      # ------------------------------------------------------
      # CHECKOUT SOURCE CODE
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------
      # DOWNLOAD BACKEND COVERAGE
      # ------------------------------------------------------
      #
      # backend-ci uploaded:
      #
      # backend/coverage/lcov.info
      #
      # We now download that artifact into the same path.
      #
      # ------------------------------------------------------
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage


      # ------------------------------------------------------
      # VERIFY DOWNLOADED COVERAGE
      # ------------------------------------------------------
      #
      # This confirms that the SonarQube runner actually has
      # the coverage file before the scanner starts.
      #
      # ------------------------------------------------------
      - name: Verify downloaded coverage
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking SonarQube coverage report"
          echo "========================================"

          test -f backend/coverage/lcov.info

          ls -lh backend/coverage/lcov.info

          echo ""
          echo "Coverage report is available to SonarQube."


      # ------------------------------------------------------
      # RUN SONARQUBE SCAN
      # ------------------------------------------------------
      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      # ------------------------------------------------------
      # CHECK SONARQUBE QUALITY GATE
      # ------------------------------------------------------
      #
      # The pipeline waits for SonarQube to calculate the
      # Quality Gate result.
      #
      # ------------------------------------------------------
      - name: Check SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}



  # ==========================================================
  # 4. DOCKER BUILD, TRIVY SCAN AND PUSH
  # ==========================================================
  docker-build-scan-and-push:
    name: Build, Scan and Push Docker Images

    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # Docker images are built only after SonarQube passes.
    # --------------------------------------------------------
    needs:
      - sonarqube

    # --------------------------------------------------------
    # Only push images when the event is a push to main.
    # Pull requests do not push images.
    # --------------------------------------------------------
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # CHECKOUT SOURCE CODE
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # SET UP DOCKER BUILDX
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------------------
      # LOGIN TO DOCKER HUB
      # ------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------------------
      # BUILD FRONTEND IMAGE
      # ------------------------------------------------------
      - name: Build frontend image locally
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          # Do not push before Trivy scanning.
          push: false

          # Load image into local Docker image store.
          load: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ------------------------------------------------------
      # BUILD BACKEND IMAGE
      # ------------------------------------------------------
      - name: Build backend image locally
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile

          # Do not push before Trivy scanning.
          push: false

          # Load image into local Docker image store.
          load: true

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ------------------------------------------------------
      # VERIFY LOCALLY BUILT IMAGES
      # ------------------------------------------------------
      - name: Verify locally built images
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Docker images available on the runner"
          echo "========================================"

          docker image ls

          echo ""
          echo "Checking frontend image..."

          docker image inspect \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}" \
            > /dev/null

          echo "Frontend image found successfully."

          echo ""
          echo "Checking backend image..."

          docker image inspect \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}" \
            > /dev/null

          echo "Backend image found successfully."


      # ------------------------------------------------------
      # TRIVY FRONTEND IMAGE SCAN
      # ------------------------------------------------------
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table

          # Learning mode:
          # vulnerabilities are displayed but do not stop
          # the pipeline.
          exit-code: "0"


      # ------------------------------------------------------
      # TRIVY BACKEND IMAGE SCAN
      # ------------------------------------------------------
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"


      # ------------------------------------------------------
      # PUSH FRONTEND IMAGE
      # ------------------------------------------------------
      - name: Push frontend image to Docker Hub
        shell: bash
        run: |
          set -e

          echo "Pushing commit-specific frontend image..."

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}"

          echo "Pushing latest frontend image..."

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:latest"


      # ------------------------------------------------------
      # PUSH BACKEND IMAGE
      # ------------------------------------------------------
      - name: Push backend image to Docker Hub
        shell: bash
        run: |
          set -e

          echo "Pushing commit-specific backend image..."

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}"

          echo "Pushing latest backend image..."

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:latest"


      # ------------------------------------------------------
      # PIPELINE SUMMARY
      # ------------------------------------------------------
      - name: Print Docker pipeline summary
        shell: bash
        run: |
          echo "========================================"
          echo "Docker pipeline completed successfully"
          echo "========================================"

          echo ""
          echo "Frontend image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}"

          echo ""
          echo "Backend image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}"

          echo ""
          echo "Trivy security gate: Learning mode"
          echo "Trivy exit code: 0"



  # ==========================================================
  # 5. DEPLOY TO UBUNTU VM
  # ==========================================================
  deploy-to-ubuntu-vm:
    name: Deploy Application to Ubuntu VM

    needs:
      - docker-build-scan-and-push

    runs-on: self-hosted

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # SHOW RUNNER INFORMATION
      # ------------------------------------------------------
      - name: Verify deployment environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Deployment environment"
          echo "========================================"

          echo "Current user:"
          whoami

          echo ""
          echo "Home directory:"
          echo "$HOME"

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "Operating system:"
          uname -a

          echo ""
          echo "Docker version:"
          docker --version

          echo ""
          echo "Docker Compose version:"
          docker compose version

          echo ""
          echo "========================================"


      # ------------------------------------------------------
      # VERIFY DOCKER ACCESS
      # ------------------------------------------------------
      - name: Verify Docker access
        shell: bash
        run: |
          set -e

          echo "Checking Docker daemon..."

          docker ps

          echo ""
          echo "Docker access confirmed."


      # ------------------------------------------------------
      # PREPARE APPLICATION DIRECTORY
      # ------------------------------------------------------
      - name: Prepare application directory
        shell: bash
        run: |
          set -e

          echo "Creating application directory..."

          mkdir -p "$HOME/madhubani-app"

          echo "Copying compose.yaml..."

          cp compose.yaml \
            "$HOME/madhubani-app/compose.yaml"

          echo ""
          echo "Application directory:"

          ls -la "$HOME/madhubani-app"


      # ------------------------------------------------------
      # VALIDATE DOCKER COMPOSE CONFIGURATION
      # ------------------------------------------------------
      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -e

          cd "$HOME/madhubani-app"

          echo "========================================"
          echo "Docker Compose configuration"
          echo "========================================"

          docker compose config

          echo ""
          echo "Docker Compose configuration is valid."


      # ------------------------------------------------------
      # LOGIN TO DOCKER HUB ON VM
      # ------------------------------------------------------
      - name: Login to Docker Hub on Ubuntu VM
        shell: bash
        run: |
          set -e

          echo "Logging in to Docker Hub..."

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

          echo "Docker Hub login successful."


      # ------------------------------------------------------
      # PULL LATEST DOCKER IMAGES
      # ------------------------------------------------------
      - name: Pull latest Docker images
        shell: bash
        run: |
          set -e

          cd "$HOME/madhubani-app"

          echo "========================================"
          echo "Pulling latest Docker images"
          echo "========================================"

          docker compose pull

          echo ""
          echo "Docker images pulled successfully."


      # ------------------------------------------------------
      # DEPLOY APPLICATION
      # ------------------------------------------------------
      - name: Deploy latest images
        shell: bash
        run: |
          set -e

          cd "$HOME/madhubani-app"

          echo "======================================"
          echo "Starting Madhubani deployment"
          echo "======================================"

          echo ""
          echo "Starting updated application..."

          docker compose up -d --remove-orphans

          echo ""
          echo "Application containers started."


      # ------------------------------------------------------
      # SHOW CONTAINER STATUS
      # ------------------------------------------------------
      - name: Check container status
        shell: bash
        run: |
          set -e

          cd "$HOME/madhubani-app"

          echo "========================================"
          echo "Current container status"
          echo "========================================"

          docker compose ps

          echo ""
          echo "All Docker containers:"

          docker ps


      # ------------------------------------------------------
      # CLEAN UNUSED IMAGES
      # ------------------------------------------------------
      - name: Remove unused Docker images
        shell: bash
        run: |
          set -e

          echo "Removing unused Docker images..."

          docker image prune -f

          echo "Docker cleanup completed."


      # ------------------------------------------------------
      # DEPLOYMENT SUMMARY
      # ------------------------------------------------------
      - name: Deployment summary
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "Madhubani deployment completed"
          echo "========================================"

          echo ""
          echo "Runner:"
          echo "santosh-vm"

          echo ""
          echo "Deployment directory:"
          echo "$HOME/madhubani-app"

          echo ""
          echo "Frontend image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:latest"

          echo ""
          echo "Backend image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:latest"

          echo ""
          echo "Application status:"

          docker compose \
            -f "$HOME/madhubani-app/compose.yaml" \
            ps

          echo ""
          echo "========================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "========================================"



  # ==========================================================
  # 6. UPDATE K8S HELM CHART FOR ARGOCD
  # ==========================================================
  update-k8s-chart:
    name: Update Helm chart image tags for ArgoCD

    needs:
      - docker-build-scan-and-push

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # ------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ------------------------------------------------------
      # INSTALL YQ
      # ------------------------------------------------------
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64

          sudo chmod +x /usr/local/bin/yq


      # ------------------------------------------------------
      # UPDATE IMAGE TAGS
      # ------------------------------------------------------
      - name: Update image tags in values.yaml
        run: |
          yq -i \
            '.backend.image = "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-backend:${{ github.sha }}"' \
            madhubani-chart/values.yaml

          yq -i \
            '.frontend.image = "${{ secrets.DOCKERHUB_USERNAME }}/madhubani-frontend:${{ github.sha }}"' \
            madhubani-chart/values.yaml


      # ------------------------------------------------------
      # COMMIT AND PUSH UPDATED HELM VALUES
      # ------------------------------------------------------
      - name: Commit & push updated values.yaml
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add madhubani-chart/values.yaml

          git commit \
            -m "chore: deploy image ${{ github.sha }} to k8s [skip ci]" \
            || echo "No changes to commit"

          git pull --rebase origin main

          git push